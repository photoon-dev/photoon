services:
  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_PROTOCOL: ${NEXT_PUBLIC_PROTOCOL}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks: [web]

  # Worker de renderização: o único processo que tira job da fila.
  #
  # Container separado de propósito (regra 9 do briefing): `sharp` em 300 dpi
  # come CPU e memória, e dentro do processo do Next isso bloquearia as
  # requisições do painel. Aqui ele pode morrer e voltar sem derrubar o site.
  #
  # A SUPABASE_SERVICE_ROLE_KEY vive em `.env.worker`, NAO em `.env`.
  #
  # Os dois servicos leem `.env`. Se a chave de servico estivesse la, o
  # container do site tambem a teria no ambiente — e ela atravessa lojas,
  # ignorando a RLS. Qualquer codigo de servidor do Next passaria a poder ler
  # o banco inteiro de todas as lojas. Um arquivo separado, lido so por este
  # servico, mantem a chave onde ela deve estar: no worker, e em nenhum outro
  # lugar.
  render:
    build:
      context: .
      # Estagio proprio: o `runner` do Next so tem o `standalone`, sem `tools/`
      # nem `src/`, entao o worker nao teria o proprio codigo la dentro.
      target: worker
    restart: unless-stopped
    env_file:
      - .env
      - .env.worker
    networks: [web]
    depends_on: [app]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
