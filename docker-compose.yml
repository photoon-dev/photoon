services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_PROTOCOL: ${NEXT_PUBLIC_PROTOCOL}
    restart: unless-stopped
    env_file: .env
    expose:
      - "3000"
    networks: [web]

  # Worker de renderização: o único processo que tira job da fila.
  #
  # Container separado de propósito (regra 9 do briefing): `sharp` em 300 dpi
  # come CPU e memória, e dentro do processo do Next isso bloquearia as
  # requisições do painel. Aqui ele pode morrer e voltar sem derrubar o site.
  #
  # Precisa de SUPABASE_SERVICE_ROLE_KEY no .env — é a única peça do sistema
  # que atravessa lojas, e a RLS é por sessão de usuário.
  render:
    build:
      context: .
    restart: unless-stopped
    env_file: .env
    command: node --experimental-strip-types tools/worker-render.ts
    networks: [web]
    depends_on: [app]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [web]
    depends_on: [app]

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
